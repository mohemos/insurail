# Netlify build configuration for this Next.js (App Router) site.
#
# Framework auto-detection did not activate for this site (observed: build
# ran `next build` successfully, but the deploy step uploaded only a handful
# of raw repo-root files with 0 functions — i.e. @netlify/plugin-nextjs never
# ran to convert the .next output into Netlify Functions/Edge Functions).
# @netlify/plugin-nextjs is pinned as a devDependency and registered below so
# it always runs regardless of auto-detection.
# https://docs.netlify.com/build/frameworks/framework-setup-guides/nextjs/overview/
#
# Security headers live in next.config.ts (`headers()`); the runtime reads and
# applies them, so no [[headers]] block is needed here either.
#
# Node.js version is pinned in .nvmrc, not here (Next.js 16 requires >= 20.9).
#
# NOTE: this repo also has a pnpm-workspace.yaml, but it only configures
# pnpm's build-script allowlist (see its `allowBuilds` key) — it does not
# declare any packages, so this is a single-package repo, not a monorepo. If
# Netlify's UI asks for a base directory anyway, pick the repository root.

[build]
  command = "pnpm build"

[[plugins]]
  package = "@netlify/plugin-nextjs"
